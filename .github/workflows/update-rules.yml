name: Update rules

on:
  schedule:
    # GitHub cron uses UTC: 18:30 UTC is 02:30 the next day in UTC+8.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate rules
        run: python generate_rules.py

      - name: Commit generated rules
        run: |
          git add rule
          if git diff --cached --quiet; then
            echo "No rule changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push
